<div class="toast-stack" aria-live="polite">
  @for (t of toasts(); track t.id) {
    <div class="toast glass toast--{{ t.type }}" [class.toast--leaving]="false" role="status">
      <span class="toast__icon" aria-hidden="true">
        @switch (t.type) {
          @case ('success') { <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg> }
          @case ('error')   { <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg> }
          @default          { <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1.2" fill="currentColor"/></svg> }
        }
      </span>
      <span class="toast__msg">{{ t.message }}</span>
      <button class="toast__close" (click)="dismiss(t.id)" aria-label="Dismiss">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  }
</div>
