<article class="card glass">
  <div class="card__top">
    <div class="avatar" [style.background]="avatarGradient(order())">{{ initials(order().productName) }}</div>
    <div class="card__meta">
      <span class="badge badge--{{ order().status.toLowerCase() }}" [class.badge--pending]="order().status==='PENDING'">
        <span class="dot"></span>{{ order().status }}
      </span>
    </div>
    <span class="card__id">{{ order().id.slice(0, 8) }}</span>
  </div>

  <h3 class="card__name" title="{{ order().productName }}">{{ order().productName }}</h3>
  <p class="card__line">
    {{ order().quantity }} &times; {{ order().unitPrice | number: '1.2-2' }} USD
  </p>

  <div class="card__total">
    <span class="card__total-label">Total</span>
    <span class="card__total-value">{{ order().totalPrice | number: '1.2-2' }} USD</span>
  </div>

  <footer class="card__foot">
    <div class="card__actions">
      <button class="btn btn-soft" [disabled]="busy() || !canConfirm(order().status)" (click)="confirm.emit(order())">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Confirm
      </button>
      <button class="btn btn-ghost" [disabled]="busy() || !canShip(order().status)" (click)="ship.emit(order())">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 7h11v10H3zM14 10h4l3 3v4h-7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="18.5" r="1.6" stroke="currentColor" stroke-width="1.9"/><circle cx="17" cy="18.5" r="1.6" stroke="currentColor" stroke-width="1.9"/></svg>
        Ship
      </button>
      <button class="btn btn-danger icon-btn" [disabled]="busy() || !canCancel(order().status)" (click)="cancel.emit(order())" aria-label="Cancel order">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <time class="card__time" [attr.datetime]="order().createdAt">
      {{ order().createdAt | date: 'MMM d, HH:mm' }}
    </time>
  </footer>
</article>
